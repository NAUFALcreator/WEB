<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Portal - Futuristic Auth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }
        .animate-float-slow {
            animation: float 8s ease-in-out infinite;
        }
        .animate-float-delayed {
            animation: float 10s ease-in-out 3s infinite;
        }
        .animate-glow {
            animation: pulseGlow 6s ease-in-out infinite;
        }
        /* Custom smooth transition for card flip/switch */
        .form-transition {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex items-center justify-center overflow-x-hidden relative selection:bg-cyan-500 selection:text-black">

    <div class="absolute inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-1/2 -left-1/2 w-full h-full bg-gradient-to-tr from-cyan-500/20 via-indigo-600/20 to-purple-600/20 rounded-full blur-[120px] animate-glow"></div>
        <div class="absolute -bottom-1/2 -right-1/2 w-full h-full bg-gradient-to-bl from-pink-500/20 via-purple-600/20 to-cyan-500/20 rounded-full blur-[120px] animate-glow" style="animation-delay: 3s;"></div>
        
        <!-- Floating decorative neon orbs -->
        <div class="absolute top-1/4 left-10 w-24 h-24 bg-cyan-500/10 border border-cyan-500/30 rounded-2xl backdrop-blur-md animate-float-slow hidden sm:block"></div>
        <div class="absolute bottom-1/4 right-12 w-32 h-32 bg-purple-500/10 border border-purple-500/30 rounded-full backdrop-blur-md animate-float-delayed hidden sm:block"></div>
    </div>

    <div class="relative z-10 w-full max-w-md p-4 sm:p-6">
        
        <!-- Glassmorphism Card Wrapper -->
        <div class="bg-slate-900/40 backdrop-blur-2xl border border-slate-800/80 rounded-3xl shadow-[0_0_50px_rgba(0,0,0,0.8)] p-6 sm:p-8 space-y-6 relative overflow-hidden group">
            
            <!-- Neon top border accent -->
            <div class="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-transparent via-cyan-500 to-transparent opacity-75"></div>

            <!-- Header Section -->
            <div class="text-center space-y-2">
                <div class="inline-flex items-center justify-center w-14 h-14 bg-gradient-to-tr from-cyan-500/10 to-purple-500/10 border border-cyan-500/30 rounded-2xl text-cyan-400 mb-2 shadow-[0_0_15px_rgba(6,182,212,0.15)] group-hover:scale-105 transition-transform duration-300">
                    <svg class="w-7 h-7 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                    </svg>
                </div>
                <h1 id="form-title" class="text-2xl sm:text-3xl font-bold tracking-tight text-white">Nexus Portal</h1>
                <p id="form-subtitle" class="text-xs sm:text-sm text-slate-400">Akses ekosistem digital futuristik Anda</p>
            </div>

            <!-- Custom Notification Banner -->
            <div id="notification-banner" class="hidden px-4 py-3 rounded-xl text-xs sm:text-sm flex items-center space-x-2 transition-all duration-300">
                <span id="notification-text">Pesan sistem...</span>
            </div>

            <!-- Quick Demo Helper -->
            <div id="demo-hint" class="bg-cyan-950/30 border border-cyan-500/20 text-cyan-300 px-3 py-2 rounded-xl text-xs flex justify-between items-center backdrop-blur-md">
                <span>⚡ Demo: <b>admin@nexus.io</b> / <b>123456</b></span>
            </div>

            <!-- Forms Container -->
            <div class="relative">
                
                <!-- LOGIN FORM -->
                <form id="login-form" class="space-y-4 form-transition" onsubmit="handleAuthSubmit(event, 'login')">
                    <div class="space-y-1">
                        <label class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Alamat Email</label>
                        <input type="email" id="login-email" required placeholder="nama@nexus.io"
                            class="w-full bg-slate-950/60 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all shadow-inner">
                    </div>

                    <div class="space-y-1">
                        <div class="flex justify-between items-center">
                            <label class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Kata Sandi</label>
                            <a href="#" onclick="showNotification('Fitur pemulihan sandi dikirim via jaringan aman.', 'info')" class="text-xs text-cyan-400 hover:text-cyan-300 transition-colors">Lupa sandi?</a>
                        </div>
                        <input type="password" id="login-password" required placeholder="••••••••"
                            class="w-full bg-slate-950/60 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all shadow-inner">
                    </div>

                    <button type="submit" id="login-btn"
                        class="w-full mt-2 bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-slate-950 font-bold py-3.5 rounded-xl shadow-[0_0_20px_rgba(6,182,212,0.4)] hover:shadow-[0_0_25px_rgba(6,182,212,0.7)] active:scale-[0.98] transition-all flex items-center justify-center space-x-2 cursor-pointer">
                        <span>Masuk Sistem</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                        </svg>
                    </button>
                </form>

                <!-- SIGNUP FORM (Hidden by default) -->
                <form id="signup-form" class="space-y-4 form-transition hidden" onsubmit="handleAuthSubmit(event, 'signup')">
                    <div class="space-y-1">
                        <label class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Nama Lengkap</label>
                        <input type="text" id="signup-name" required placeholder="Alexander Vance"
                            class="w-full bg-slate-950/60 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition-all shadow-inner">
                    </div>

                    <div class="space-y-1">
                        <label class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Alamat Email</label>
                        <input type="email" id="signup-email" required placeholder="nama@nexus.io"
                            class="w-full bg-slate-950/60 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition-all shadow-inner">
                    </div>

                    <div class="space-y-1">
                        <label class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Buat Kata Sandi</label>
                        <input type="password" id="signup-password" required placeholder="••••••••"
                            class="w-full bg-slate-950/60 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition-all shadow-inner">
                    </div>

                    <button type="submit" id="signup-btn"
                        class="w-full mt-2 bg-gradient-to-r from-purple-500 to-pink-600 hover:from-purple-400 hover:to-pink-500 text-white font-bold py-3.5 rounded-xl shadow-[0_0_20px_rgba(168,85,247,0.4)] hover:shadow-[0_0_25px_rgba(168,85,247,0.7)] active:scale-[0.98] transition-all flex items-center justify-center space-x-2 cursor-pointer">
                        <span>Daftarkan Akun Baru</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                        </svg>
                    </button>
                </form>

            </div>

            <!-- Toggle Mode Footer -->
            <div class="text-center pt-2 border-t border-slate-800/80">
                <p id="toggle-text" class="text-xs text-slate-400">
                    Belum punya akun? 
                    <button type="button" onclick="toggleAuthMode()" class="text-cyan-400 font-semibold hover:underline ml-1 focus:outline-none">Buat Akun</button>
                </p>
            </div>

        </div>

    </div>

    <script>
        let currentMode = 'login'; // 'login' or 'signup'

        function toggleAuthMode() {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const formTitle = document.getElementById('form-title');
            const formSubtitle = document.getElementById('form-subtitle');
            const toggleText = document.getElementById('toggle-text');
            const demoHint = document.getElementById('demo-hint');
            const notification = document.getElementById('notification-banner');

            notification.classList.add('hidden');

            if (currentMode === 'login') {
                currentMode = 'signup';
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                formTitle.innerText = "Registrasi Nexus";
                formSubtitle.innerText = "Mulai petualangan digital tanpa batas";
                demoHint.classList.add('hidden');
                toggleText.innerHTML = `Sudah punya akun? <button type="button" onclick="toggleAuthMode()" class="text-purple-400 font-semibold hover:underline ml-1 focus:outline-none">Masuk</button>`;
            } else {
                currentMode = 'login';
                signupForm.classList.add('hidden');
                loginForm.classList.remove('hidden');
                formTitle.innerText = "Nexus Portal";
                formSubtitle.innerText = "Akses ekosistem digital futuristik Anda";
                demoHint.classList.remove('hidden');
                toggleText.innerHTML = `Belum punya akun? <button type="button" onclick="toggleAuthMode()" class="text-cyan-400 font-semibold hover:underline ml-1 focus:outline-none">Buat Akun</button>`;
            }
        }

        function showNotification(message, type = 'error') {
            const banner = document.getElementById('notification-banner');
            const text = document.getElementById('notification-text');
            
            banner.classList.remove('hidden', 'bg-rose-500/10', 'border-rose-500/20', 'text-rose-400', 'bg-cyan-500/10', 'border-cyan-500/20', 'text-cyan-300', 'bg-emerald-500/10', 'border-emerald-500/20', 'text-emerald-400');
            
            if (type === 'error') {
                banner.classList.add('bg-rose-500/10', 'border', 'border-rose-500/20', 'text-rose-400');
            } else if (type === 'success') {
                banner.classList.add('bg-emerald-500/10', 'border', 'border-emerald-500/20', 'text-emerald-400');
            } else {
                banner.classList.add('bg-cyan-500/10', 'border', 'border-cyan-500/20', 'text-cyan-300');
            }
            
            text.innerText = message;
        }

        function handleAuthSubmit(event, mode) {
            event.preventDefault();
            const notification = document.getElementById('notification-banner');

            if (mode === 'login') {
                const email = document.getElementById('login-email').value.trim();
                const pass = document.getElementById('login-password').value.trim();
                const btn = document.getElementById('login-btn');

                btn.disabled = true;
                btn.innerHTML = `<svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-slate-950" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg><span>Autentikasi...</span>`;

                setTimeout(() => {
                    if (email === "admin@nexus.io" && pass === "123456") {
                        showNotification('Autentikasi Berhasil! Mengalihkan ke sistem...', 'success');
                        setTimeout(() => {
                            alert('Berhasil masuk ke Dashboard Nexus! (Simulasi)');
                            location.reload();
                        }, 800);
                    } else {
                        showNotification('Akses ditolak. Gunakan kredensial demo: admin@nexus.io / 123456', 'error');
                        btn.disabled = false;
                        btn.innerHTML = `<span>Masuk Sistem</span><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>`;
                    }
                }, 900);

            } else {
                const name = document.getElementById('signup-name').value.trim();
                const email = document.getElementById('signup-email').value.trim();
                const pass = document.getElementById('signup-password').value.trim();
                const btn = document.getElementById('signup-btn');

                btn.disabled = true;
                btn.innerHTML = `<svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg><span>Mendaftarkan akun...</span>`;

                setTimeout(() => {
                    showNotification(`Akun ${name} berhasil dibuat! Silakan masuk.`, 'success');
                    setTimeout(() => {
                        toggleAuthMode();
                        btn.disabled = false;
                        btn.innerHTML = `<span>Daftarkan Akun Baru</span><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>`;
                    }, 1000);
                }, 1000);
            }
        }
    </script>
</body>
</html>
